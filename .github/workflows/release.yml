name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run check
      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME}"
          module="github.com/trippwill/tuck/internal/app"
          ldflags="-s -w -buildid= -X ${module}.version=${version}"
          mkdir -p dist

          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="tuck_${version}_${os}_${arch}"
            mkdir -p "dist/${name}"

            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" \
              go build -buildvcs=false -trimpath -ldflags="${ldflags}" -o "dist/${name}/tuck" ./cmd/tuck

            tar --sort=name --mtime="UTC 1970-01-01" --owner=0 --group=0 --numeric-owner \
              -cf - -C dist "${name}" | gzip -n > "dist/${name}.tar.gz"
            rm -r "dist/${name}"
          done

          (cd dist && sha256sum *.tar.gz > checksums.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --verify-tag \
            --generate-notes \
            dist/*.tar.gz dist/checksums.txt
